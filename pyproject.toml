[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blenderbot"
version = "0.1.0"
description = "General Blender 5.3+ 3D Creation, Modeling, Shading, Rigging & Animation Agent"
readme = "blenderbot.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0",
  "google-genai>=1.5.0",
  "openai>=1.68.0",
  "aiohttp>=3.11.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "prompt-toolkit>=3.0.50",
  "rich>=13.9.0",
  "numpy>=1.26.0",
  "pillow>=10.2.0",
  "modal",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
blenderbot = "blenderbot.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blenderbot = ["ui/web/*", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"